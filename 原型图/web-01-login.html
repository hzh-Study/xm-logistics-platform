<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 物流运输管理平台</title>
<link rel="stylesheet" href="assets/prototype.css">
</head>
<body>
<div class="login-page"><div class="login-card"><div class="login-logo"><span class="brand-mark">运</span><span class="login-title">物流运输管理平台</span></div><p class="login-sub">账号登录</p><div class="login-hint">开发演示态：账号与密码已预填，直接点击「登录」即可进入对应身份工作台。</div><form onsubmit="return false"><div class="field"><label class="field-label">手机号</label><input class="input" value="13800138000" placeholder="请输入手机号"></div><div class="field"><div class="pwd-wrap"><input class="input" type="password" value="demo12345" placeholder="请输入密码"><button type="button" class="pwd-toggle" data-act="pwd" aria-label="显示密码"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div><button class="btn btn-primary btn-block" onclick="toast('登录成功，正在进入工作台')">登录</button></form><div class="login-foot"><button class="btn btn-text" id="registerToggle" onclick="toggleRegister()">注册新账号</button></div><div class="register-zone" id="registerZone"><p class="panel-hint" style="margin:0 0 12px">选择主体类型后填写资料，注册通过后进入对应工作台。</p><div class="field"><label class="field-label">主体类型</label><div class="radio-row"><label><input type="radio" name="regtype" value="货主" checked>货主</label><label><input type="radio" name="regtype" value="物流公司">物流公司</label></div></div><div class="field"><label class="field-label"><span class="req">*</span>手机号</label><input class="input" type="text" placeholder="请输入手机号" value=""></div><div class="field"><label class="field-label"><span class="req">*</span>密码</label><input class="input" type="password" placeholder="至少 8 位" value=""><div class="help">密码不少于 8 位，建议使用字母与数字组合。</div></div><div class="field" id="regCompany" style="display:none"><label class="field-label"><span class="req">*</span>企业名称</label><input class="input" type="text" placeholder="请输入营业执照上的企业名称" value=""></div><button class="btn btn-primary btn-block" onclick="toast('注册成功，请完成认证')">注册并进入</button></div></div></div><script>document.addEventListener("change",function(e){if(e.target&&e.target.name==="regtype"){document.getElementById("regCompany").style.display=e.target.value==="物流公司"?"block":"none";}});</script>
<script src="assets/prototype.js"></script>
</body>
</html>
