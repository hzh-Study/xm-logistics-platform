<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>身份绑定</title>
<link rel="stylesheet" href="assets/prototype.css">
</head>
<body>
<div class="h5-stage"><div class="phone"><div class="h5-status"><span>9:41</span><span>信号 · Wi-Fi · 100%</span></div><div class="h5-nav">身份绑定</div><div class="h5-scroll"><div class="h5-steps"><div class="h5-step on" id="stepDot1"><i>1</i>修改密码</div><div class="h5-step" id="stepDot2"><i>2</i>身份资料</div><div class="h5-step" id="stepDot3"><i>3</i>确认</div></div><div id="step1"><div class="h5-card"><div class="h5-card-title">修改初始密码</div><div class="h5-card-sub">首次登录必须修改临时密码</div><label class="h5-label">当前临时密码</label><input class="input" type="password" placeholder="请输入" value="temp@2026"><label class="h5-label">新密码</label><input class="input" type="password" placeholder="至少 8 位" value=""><label class="h5-label">确认新密码</label><input class="input" type="password" placeholder="请再次输入" value=""><div class="help">新密码不少于 8 位，包含字母与数字。</div></div></div><div id="step2" style="display:none"><div class="h5-card"><div class="h5-card-title">身份与驾照资料</div><label class="h5-label">真实姓名</label><input class="input" type="text" placeholder="请输入姓名" value="王建国"><label class="h5-label">身份证号</label><input class="input" type="text" placeholder="请输入身份证号" value=""><label class="h5-label">准驾车型</label><select class="select"><option>A2</option><option>A1</option><option>A2</option><option>B2</option><option>C1</option></select><label class="h5-label">驾驶证号</label><input class="input" type="text" placeholder="请输入驾驶证号" value=""><label class="h5-label">驾驶证有效期</label><input class="input" type="text" placeholder="" value="2030-06-30"><label class="h5-label">身份证 / 驾驶证照片</label><div class="h5-upload" data-act="upload"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3"/></svg><span>点击上传证件照片</span></div></div></div><div id="step3" style="display:none"><div class="h5-card"><div class="h5-card-title">确认绑定信息</div><div class="h5-row"><span class="k">姓名</span><span class="v">王建国</span></div><div class="h5-row"><span class="k">所属公司</span><span class="v">盛达物流有限公司</span></div><div class="h5-row"><span class="k">准驾车型</span><span class="v">A2</span></div><div class="h5-row"><span class="k">账号状态</span><span class="v"><span class="pill pill--success">正常使用</span></span></div><div class="h5-row"><span class="k">雇佣关系</span><span class="v"><span class="pill pill--success">在职</span></span></div><div class="notice notice-info" style="margin-top:12px"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg><div>确认后完成身份绑定，公司归属不可自行变更。</div></div></div></div></div><div class="h5-bottom"><button class="btn btn-secondary" id="prevBtn2" style="display:none" onclick="goStep(2)">上一步</button><button class="btn btn-primary" id="nextBtn1" onclick="goStep(2)">下一步</button><button class="btn btn-secondary" id="prevBtn3" style="display:none" onclick="goStep(2)">上一步</button><button class="btn btn-primary" id="nextBtn2" style="display:none" onclick="goStep(3)">下一步</button><button class="btn btn-primary" id="doneBtn" style="display:none" onclick="toast('身份绑定完成，进入工作台')">完成绑定</button></div></div></div>
<script src="assets/prototype.js"></script>
</body>
</html>
